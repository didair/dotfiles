#################################
#       Picom Configuration     #
#################################

# Backend
backend = "glx";  # Use 'xrender' if you have issues with 'glx'

# General
vsync = true;
unredir-if-possible = false;
use-damage = true;

# Rounded corners
corner-radius = 6;
round-borders = 1;
round-borders-rule = [];

# Fading
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 10;
fade-exclude = [];

# Animations (requires animation-supporting fork of picom)
transition-length = 300;
transition-pow-x = 0.3;
transition-pow-y = 0.3;
transition-pow-w = 0.2;
transition-pow-h = 0.2;
size-transition = true;

# Shadows (optional, adjust to taste)
shadow = true;
shadow-radius = 10;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-opacity = 0.6;
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'i3-frame'",
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# Transparency (optional)
inactive-opacity = 0.9;
active-opacity = 1.0;
frame-opacity = 0.9;

# Blur (optional)
blur-background = true;
blur-method = "dual_kawase";
blur-strength = 5;
blur-background-frame = true;
blur-background-fixed = true;

# Exclude certain windows from effects
wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.95; };
  dock = { shadow = false; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.95; };
  dropdown_menu = { opacity = 0.95; };
}

